<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>支付已取消 - 闪电下载</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #F5F7FA; color: #111827; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(37, 99, 235, .08);
      max-width: 440px; width: 100%; padding: 40px 32px; text-align: center;
    }
    .icon { font-size: 46px; margin-bottom: 14px; }
    h1 { font-size: 21px; margin-bottom: 10px; }
    p { font-size: 14px; color: #6B7280; line-height: 1.8; }
    .btn {
      display: inline-block; margin-top: 20px; padding: 12px 34px; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; border: none; text-decoration: none;
    }
    .btn-primary { background: #2563EB; color: #fff; }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-ghost { background: none; border: 1.5px solid #E5E7EB; color: #6B7280; margin-left: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛑</div>
    <h1>支付已取消</h1>
    <p>你已取消本次支付，未产生任何扣款。<br>会员权益（AI 不限次总结与问答）随时可以再来开通。</p>
    <a class="btn btn-primary" href="/#pricing">重新开通会员</a>
    <a class="btn btn-ghost" href="/">返回首页</a>
  </div>
</body>
</html>
